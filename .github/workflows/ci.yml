name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          working-directory: pipeline
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test (includes the feature-parity fixture)
        run: uv run pytest
      - name: Smoke run (synthetic data -> prepare -> train -> evaluate -> ONNX export)
        run: uv run gesturesign smoke
      - name: Audit dependencies
        run: uv run pip-audit --skip-editable

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run format:check && npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (includes the feature-parity fixture)
        run: npm test
      - name: Build (fetches MediaPipe models and checks their SHA-256)
        run: npm run build
      - name: The production build has no test hook
        run: '! grep -rl "__gesturesignTest" dist'
      - name: The production build ships only the WebAssembly runtime (no WebGPU or JSEP build)
        run: '! find dist -iname "*jsep*" -o -iname "*asyncify*" -o -iname "*webgpu*" | grep .'
      - name: End-to-end tests
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
